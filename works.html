<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* language: saved choice, else the browser language; French pages stay hidden until translated (max 1.5 s) */
    try {
      var q = (location.search.match(/[?&]lang=(fr|en)/) || [])[1]; var l = q || localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
      document.documentElement.lang = l;
      if (l === "fr") { document.documentElement.classList.add("i18n-pending"); setTimeout(function () { document.documentElement.classList.remove("i18n-pending"); }, 1500); }
    } catch (e) {}
  </script>
  <script type="module" src="js/i18n.js"></script> <!-- first: translates before GSAP is even downloaded -->
  <title data-i18n="title.works">Works — Shaiba Imane</title>
  <meta name="description" content="Selected projects by Shaiba Imane, front-end developer: motion, GSAP, WordPress and visual identities brought to the web.">
  <!-- link previews (Teams, WhatsApp, LinkedIn, iMessage…): 1200 × 630 image, absolute URLs -->
  <link rel="canonical" href="https://shaiba-imane.vercel.app/works.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shaiba Imane">
  <meta property="og:title" content="Works — Shaiba Imane">
  <meta property="og:description" content="Selected projects by Shaiba Imane, front-end developer: motion, GSAP, WordPress and visual identities brought to the web.">
  <meta property="og:url" content="https://shaiba-imane.vercel.app/works.html">
  <meta property="og:image" content="https://shaiba-imane.vercel.app/assets/og/works.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Works page of Shaiba Imane&#x27;s portfolio: project folders with screenshots">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://op2qjg9p.apicdn.sanity.io" crossorigin>
  <link rel="preconnect" href="https://cdn.sanity.io"> <!-- no crossorigin: images are not CORS requests -->
  <link rel="preload" href="assets/fonts/tox-typewriter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/i-eat-crayons.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/works.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script type="module" src="js/works.js"></script>
</head>
<body class="page-works">
  <a class="skip-link" href="#works-title" data-i18n="skip.projects">Skip to projects</a>

  <div class="works-scene" data-scene>
  <header class="page-header">
    <a class="ui-site-name notranslate" translate="no" href="index.html" data-marker="fluo">Shaiba Imane</a>
  </header>
  <p class="tape-links tape-links--corner">
    <a class="tape-link tape-link--linkedin" href="https://www.linkedin.com/in/imane-shaiba/" target="_blank" rel="noopener"><span class="tape-link__text">LinkedIn</span></a>
    <a class="tape-link tape-link--contact" href="mailto:imane.shaiba@outlook.com"><span class="tape-link__text">Contact</span></a>
  </p>

  <main class="works">
    <div class="works__head">
      <h1 class="works__title" id="works-title"><span data-i18n="works.title">Works</span> <span class="works__count" data-count>(…)</span></h1>
      <p class="works__progress" data-progress aria-hidden="true"></p>
    </div>

    <!-- Filled from Sanity (js/works.js). One folder per project; they stack up as you scroll.
         The skeleton stays visible until the data arrives. -->
    <ol class="works__stack" data-grid aria-busy="true" aria-describedby="works-status">
      <li class="folder folder--loading" style="--i: 0" aria-hidden="true">
        <div class="folder__tab"><span class="skeleton skeleton--tab"></span></div>
        <div class="folder__body">
          <div class="folder__text">
            <span class="skeleton skeleton--kicker"></span>
            <span class="skeleton skeleton--title"></span>
            <span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line skeleton--short"></span>
            <span class="skeleton skeleton--meta"></span><span class="skeleton skeleton--meta"></span><span class="skeleton skeleton--meta"></span>
          </div>
          <span class="skeleton skeleton--image"></span>
        </div>
      </li>
    </ol>
    <p class="works__status" id="works-status" role="status" data-status data-i18n="works.loading">Loading projects…</p>
  </main>
  </div>

  <a class="page-header__back back-link ui-home-corner" href="index.html">
    <svg class="back-arrow" viewBox="0 0 120 60" aria-hidden="true">
      <path class="back-arrow__line" pathLength="1" d="M112 58C110 40 102 22 84 20C70 19 63 30 67 41C71 51 85 49 87 37C89 23 72 18 52 19L8 21"/>
      <path class="back-arrow__head" pathLength="1" d="M23 8L7 21L23 32"/>
    </svg>
    <span data-marker="line" data-i18n="home">Home</span>
  </a>

  <a class="ui-legal-corner" href="legal.html" data-marker="fluo" data-i18n="legal">Legal notice</a>

  <button class="ui-sound" type="button" data-sound-toggle aria-pressed="true">
    <svg class="ui-sound__icon" viewBox="0 0 16 16" aria-hidden="true"><path class="ui-sound__body" d="M2 6h3l4-3v10l-4-3H2z"/><path class="ui-sound__waves" d="M11 5.5c1 .7 1.5 1.6 1.5 2.5s-.5 1.8-1.5 2.5M12.8 3.5C14.3 4.6 15 6.2 15 8s-.7 3.4-2.2 4.5"/><path class="ui-sound__off" d="M11 6l4 4M15 6l-4 4"/></svg>
    <span data-sound-label>sound on</span>
  </button>

  <nav class="dock" aria-label="Main" data-i18n-aria="nav.main">
    <a class="dock__item" href="works.html" aria-current="page">
      <span class="dock__icon"><img src="assets/img/home/sticker-folder.webp" srcset="assets/img/home/sticker-folder-m.webp 54w, assets/img/home/sticker-folder-l.webp 81w, assets/img/home/sticker-folder.webp 108w" sizes="(max-width: 40rem) 39px, 54px" alt="" width="108" height="84"></span>
      <span class="dock__label" data-i18n="dock.works">works</span>
    </a>
    <a class="dock__item" href="quests.html">
      <span class="dock__icon"><img src="assets/img/home/sticker-plant-flowers.webp" srcset="assets/img/home/sticker-plant-flowers-xs.webp 80w, assets/img/home/sticker-plant-flowers-m.webp 159w, assets/img/home/sticker-plant-flowers-l.webp 239w, assets/img/home/sticker-plant-flowers.webp 318w" sizes="(max-width: 40rem) 39px, 54px" alt="" width="318" height="323"></span>
      <span class="dock__label" data-i18n="dock.quests">quests</span>
    </a>
    <a class="dock__item" href="index.html#profile">
      <span class="dock__icon dock__icon--photo"><img src="assets/img/home/dock-photo-imane.webp" srcset="assets/img/home/dock-photo-imane-m.webp 80w, assets/img/home/dock-photo-imane.webp 160w" sizes="(max-width: 40rem) 52px, 72px" alt="" width="160" height="160"></span>
      <span class="dock__label" data-i18n="dock.profile">profile</span>
    </a>
  </nav>

  <!-- One project = one folder (Figma component "Card-project", stacked layout). -->
  <template id="folder-template">
    <li class="folder">
      <article class="folder__inner">
        <div class="folder__tab" aria-hidden="true"><span class="folder__tab-title" data-field="titre"></span></div>
        <div class="folder__body">
          <div class="folder__text">
            <p class="folder__kicker"><span data-field="type"></span> · <span data-field="annee"></span></p>
            <h2 class="folder__title"><span class="folder__title-mark" data-field="titre"></span></h2>
            <p class="folder__description" data-field="description"></p>
            <dl class="folder__meta">
              <div><dt data-i18n="works.year">Year</dt><dd data-field="annee"></dd></div>
              <div><dt data-i18n="works.type">Type</dt><dd data-field="type"></dd></div>
              <div><dt data-i18n="works.tools">Tools</dt><dd data-field="outils"></dd></div>
              <div><dt data-i18n="works.link">Link</dt><dd><a data-field="lien" target="_blank" rel="noopener" data-marker="fluo" data-i18n="works.viewLive">View live site</a></dd></div>
            </dl>
          </div>
          <figure class="folder__photo">
            <div class="folder__photo-frame"><img data-field="image" alt="" width="592" height="323" decoding="async"></div>
          </figure>
          <span class="folder__number" aria-hidden="true" data-field="numero"></span>
        </div>
      </article>
    </li>
  </template>
</body>
</html>
